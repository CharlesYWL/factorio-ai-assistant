<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15191d"/>
      <stop offset="1" stop-color="#252b30"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <style>
      .text { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #e8edf1; }
      .muted { fill: #929ba3; }
      .small { font-size: 14px; }
      .body { font-size: 17px; }
      .label { font-size: 15px; font-weight: 700; }
      .title { font-size: 24px; font-weight: 700; }
      .tab { font-size: 16px; font-weight: 700; }
      .number { fill: #ffc34d; font-weight: 700; }
      .done { fill: #6d767d; }
    </style>
  </defs>
  <rect width="1280" height="880" fill="url(#background)"/>
  <circle cx="1100" cy="80" r="250" fill="#3789b8" opacity=".08"/>
  <circle cx="170" cy="800" r="280" fill="#58a86a" opacity=".06"/>

  <g filter="url(#shadow)">
    <rect x="80" y="55" width="760" height="770" rx="8" fill="#292f34" stroke="#495158"/>
    <rect x="80" y="55" width="760" height="52" rx="8" fill="#202529"/>
    <text class="text title" x="105" y="89">Factorio AI 顾问</text>
    <circle cx="668" cy="80" r="6" fill="#55d77d"/>
    <text class="text small" x="681" y="85" fill="#55d77d">本机已连接</text>
    <text class="text body" x="805" y="86">×</text>

    <text class="text small muted" x="105" y="133">第三方只读顾问 · 不是 Factorio 官方提示 · 不会修改工厂</text>

    <g transform="translate(105 153)">
      <rect width="112" height="38" rx="4" fill="#d48629"/>
      <text class="text tab" x="39" y="25">聊天</text>
      <rect x="120" width="112" height="38" rx="4" fill="#3a4248"/>
      <text class="text tab" x="151" y="25">提醒</text>
      <rect x="240" width="112" height="38" rx="4" fill="#3a4248"/>
      <text class="text tab" x="271" y="25">状态</text>
    </g>

    <rect x="105" y="210" width="710" height="96" rx="5" fill="#20262a" stroke="#3f484f"/>
    <text class="text label" x="125" y="238" fill="#69df8d">你</text>
    <text class="text body" x="125" y="272">每分钟 45 个蓝瓶需要多少台机器？</text>

    <rect x="105" y="320" width="710" height="298" rx="5" fill="#20262a" stroke="#3f484f"/>
    <text class="text label" x="125" y="348" fill="#63bfe8">AI 顾问</text>
    <text class="text body" x="125" y="380">[C1] 化学科技包 <tspan class="number">45/min</tspan>：组装机 3 精确 <tspan class="number">7.2 台</tspan>。</text>
    <text class="text body" x="125" y="408">向上取整建造 <tspan class="number">8 台</tspan>；假设：无插件。</text>

    <line x1="125" y1="428" x2="795" y2="428" stroke="#3f484f"/>
    <text class="text label muted" x="125" y="454">建议的下一步</text>

    <text class="text small" x="125" y="484">按满负载上限准备 <tspan class="number">8 台</tspan>组装机 3；精确需求 <tspan class="number">7.2 台</tspan>。</text>
    <rect x="655" y="466" width="140" height="30" rx="4" fill="#3a4248" stroke="#59636b"/>
    <text class="text small" x="704" y="486" fill="#c8d0d6">加入待办</text>

    <text class="text small" x="125" y="524">增加发电或燃料供给，把电力满足率拉回 <tspan class="number">90%</tspan> 以上。</text>
    <rect x="655" y="506" width="140" height="30" rx="4" fill="#2f3a33" stroke="#46554b"/>
    <text class="text small" x="704" y="526" fill="#6d8f78">已加入</text>

    <text class="text small" x="125" y="564">补齐化学科技包产线，为下一阶段科技做准备。</text>
    <rect x="655" y="546" width="140" height="30" rx="4" fill="#3a4248" stroke="#59636b"/>
    <text class="text small" x="704" y="566" fill="#c8d0d6">加入待办</text>

    <text class="text small muted" x="125" y="600">回答来源：本地规则 · 待办只由你点击确认后写入</text>

    <g transform="translate(105 636)">
      <rect width="132" height="34" rx="4" fill="#3a4248"/>
      <text class="text small" x="27" y="22">最大瓶颈</text>
      <rect x="140" width="132" height="34" rx="4" fill="#3a4248"/>
      <text class="text small" x="165" y="22">下一步扩建</text>
      <rect y="40" width="132" height="34" rx="4" fill="#3a4248"/>
      <text class="text small" x="23" y="62">电力与科研</text>
      <rect x="140" y="40" width="132" height="34" rx="4" fill="#3a4248"/>
      <text class="text small" x="167" y="62">产线配比</text>
      <rect x="598" y="20" width="112" height="34" rx="4" fill="#3a4248" stroke="#59636b"/>
      <text class="text small" x="632" y="42">清空</text>
    </g>
    <rect x="105" y="728" width="585" height="52" rx="4" fill="#151a1d" stroke="#59636b"/>
    <text class="text body muted" x="125" y="760">输入工厂问题；按 Enter 发送</text>
    <rect x="704" y="728" width="111" height="52" rx="4" fill="#d48629"/>
    <text class="text tab" x="742" y="760">发送</text>
  </g>

  <g transform="translate(885 75)">
    <text class="text title" x="0" y="24">提醒与待办，一处闭环</text>

    <rect x="0" y="52" width="315" height="180" rx="7" fill="#292f34" stroke="#495158"/>
    <text class="text label" x="20" y="80" fill="#ffb33f">顾问提醒（2）· 左上角常驻</text>
    <text class="text small" x="20" y="108" fill="#ff5a4d">[严重] 关键材料缺口</text>
    <text class="text small muted" x="20" y="128">铁板 2400/min 消费 · 900/min 生产</text>
    <rect x="255" y="94" width="24" height="20" rx="3" fill="#3a4248"/>
    <text class="text small" x="262" y="109" fill="#c8d0d6">↗</text>
    <rect x="283" y="94" width="24" height="20" rx="3" fill="#3a4248"/>
    <text class="text small" x="291" y="109" fill="#c8d0d6">✕</text>
    <line x1="20" y1="140" x2="295" y2="140" stroke="#3f484f"/>
    <text class="text small" x="20" y="164" fill="#ffb33f">[警告] 电力满足率过低</text>
    <text class="text small muted" x="20" y="184">电力满足率 78%（62 / 80 MW）</text>
    <rect x="255" y="150" width="24" height="20" rx="3" fill="#3a4248"/>
    <text class="text small" x="262" y="165" fill="#c8d0d6">↗</text>
    <rect x="283" y="150" width="24" height="20" rx="3" fill="#3a4248"/>
    <text class="text small" x="291" y="165" fill="#c8d0d6">✕</text>
    <rect x="20" y="196" width="124" height="26" rx="4" fill="#3a4248" stroke="#59636b"/>
    <text class="text small" x="42" y="214" fill="#c8d0d6">未完成待办：2</text>
    <rect x="191" y="196" width="104" height="26" rx="4" fill="#3a4248" stroke="#59636b"/>
    <text class="text small" x="214" y="214" fill="#c8d0d6">清理全部</text>

    <rect x="0" y="252" width="315" height="270" rx="7" fill="#292f34" stroke="#495158"/>
    <text class="text label" x="20" y="280" fill="#ffc34d">待办列表（未完成 2 / 共 3）</text>
    <rect x="150" y="292" width="80" height="24" rx="4" fill="#3a4248" stroke="#59636b"/>
    <text class="text small" x="164" y="309" fill="#c8d0d6">清理已完成</text>
    <rect x="236" y="292" width="60" height="24" rx="4" fill="#3a4248" stroke="#59636b"/>
    <text class="text small" x="250" y="309" fill="#c8d0d6">清理全部</text>

    <rect x="16" y="328" width="283" height="58" rx="5" fill="#20262a" stroke="#3f484f"/>
    <text class="text small" x="30" y="350">按满负载准备 8 台组装机 3</text>
    <text class="text small muted" x="30" y="370">来源：产能计算 · 完成 / 删除</text>

    <rect x="16" y="394" width="283" height="58" rx="5" fill="#20262a" stroke="#3f484f"/>
    <text class="text small" x="30" y="416">增加发电或燃料供给</text>
    <text class="text small muted" x="30" y="436">来源：活动提醒 · 完成 / 删除</text>

    <rect x="16" y="460" width="283" height="52" rx="5" fill="#1c2124" stroke="#343c42"/>
    <text class="text small done" x="30" y="482">补齐化学科技包产线</text>
    <text class="text small done" x="30" y="500">来源：流程指南 · 已完成 · 恢复 / 删除</text>

    <rect x="0" y="542" width="315" height="126" rx="7" fill="#292f34" stroke="#495158"/>
    <text class="text label" x="20" y="570" fill="#63bfe8">状态</text>
    <text class="text small" x="20" y="596">Companion       已连接</text>
    <text class="text small" x="20" y="620">顾问模式         仅本地规则</text>
    <text class="text small" x="20" y="644">打开时自动暂停   已开启（单人）</text>

    <rect x="0" y="688" width="315" height="112" rx="7" fill="#20262a" stroke="#3f484f"/>
    <text class="text small muted" x="20" y="714">可复现 mock harness</text>
    <text class="text small" x="20" y="740">/factorio-ai-assistant-mock todos</text>
    <text class="text small muted" x="20" y="762">ready · chat-long · chat-append · chat-cleared</text>
    <text class="text small muted" x="20" y="784">alerts-none / one / many · alert-close / reopen</text>
  </g>
</svg>

[mod-setting-description]
factorio-ai-assistant-companion-port=Node.js Companion 使用的 localhost UDP 端口，必须与 Factorio 的 --enable-lua-udp 端口不同。
factorio-ai-assistant-advisor-quiet-mode=继续计算并在面板列出告警，但不主动发送聊天提示。
factorio-ai-assistant-advisor-muted-rules=逗号分隔：research-idle、power-low、lubricant-zero、oil-imbalance、robotics-stalled、material-deficit、production-decline。
factorio-ai-assistant-advisor-notification-cooldown-seconds=全局主动提醒与同一告警重复提醒之间的最短间隔。
factorio-ai-assistant-advisor-critical-power-bypass=严重电力告警可绕过一次全局冷却；同一告警仍受自身冷却限制。
factorio-ai-assistant-advisor-recovery-seconds=条件持续恢复多久后才关闭当前告警。
factorio-ai-assistant-advisor-research-idle-minutes=没有当前研究持续多久后触发告警。
factorio-ai-assistant-advisor-power-satisfaction-threshold=实际供电占消费的比例持续低于此值时告警。
factorio-ai-assistant-advisor-critical-power-threshold=满足率不高于此值时视为严重；运行时不会高于普通电力阈值。
factorio-ai-assistant-advisor-power-low-seconds=低电力满足率必须持续的时间。
factorio-ai-assistant-advisor-lubricant-zero-minutes=研究高级炼油后，润滑油零产出允许持续的时间。
factorio-ai-assistant-advisor-oil-imbalance-minutes=油品净积压与石油气净缺口必须同时持续的时间。
factorio-ai-assistant-advisor-oil-surplus-min-per-minute=10 分钟窗口内重油或轻油的最低净积压速度。
factorio-ai-assistant-advisor-petroleum-deficit-min-per-minute=10 分钟窗口内石油气的最低净缺口速度。
factorio-ai-assistant-advisor-science-stable-minutes=蓝瓶稳定生产多久后开始建议建设机器人科技。
factorio-ai-assistant-advisor-blue-science-min-per-minute=1 分钟和 10 分钟窗口都必须达到的蓝瓶产速。
factorio-ai-assistant-advisor-material-deficit-ratio=消费量必须超过生产量的倍率。
factorio-ai-assistant-advisor-material-deficit-min-per-minute=忽略 10 分钟消费低于此值的关键材料。
factorio-ai-assistant-advisor-material-deficit-minutes=关键材料缺口必须持续的时间。
factorio-ai-assistant-advisor-crude-decline-ratio=1 分钟原油产出低于 10 分钟产出的此比例时告警。
factorio-ai-assistant-advisor-crude-baseline-min-per-minute=忽略 10 分钟基线低于此值的原油产出。
factorio-ai-assistant-advisor-crude-decline-minutes=原油显著衰减必须持续的时间。
factorio-ai-assistant-advisor-key-material-baseline-min-per-minute=关键产线 10 分钟产速达到此值后，1 分钟归零才视为停摆。
factorio-ai-assistant-advisor-production-stop-minutes=关键产线 1 分钟产出连续归零的允许时间。

[mod-setting-description]
factorio-ai-assistant-companion-port=Localhost UDP port used by the Node.js companion. This must differ from Factorio's --enable-lua-udp port.
factorio-ai-assistant-advisor-quiet-mode=Keep evaluating and listing alerts without proactive chat messages.
factorio-ai-assistant-advisor-muted-rules=Comma-separated IDs: research-idle, power-low, lubricant-zero, oil-imbalance, robotics-stalled, material-deficit, production-decline.
factorio-ai-assistant-advisor-notification-cooldown-seconds=Minimum time between proactive alerts globally and between reminders for the same alert.
factorio-ai-assistant-advisor-critical-power-bypass=Let a critical power alert bypass the global notification cooldown once; per-alert cooldown still applies.
factorio-ai-assistant-advisor-recovery-seconds=How long a condition must remain healthy before its active alert closes.
factorio-ai-assistant-advisor-research-idle-minutes=How long no research may be active before an alert opens.
factorio-ai-assistant-advisor-power-satisfaction-threshold=Alert when delivered power remains below this fraction of consumption.
factorio-ai-assistant-advisor-critical-power-threshold=Power satisfaction at or below this value is critical; clamped to the normal threshold.
factorio-ai-assistant-advisor-power-low-seconds=How long low power satisfaction must persist.
factorio-ai-assistant-advisor-lubricant-zero-minutes=How long lubricant production may remain zero after advanced oil processing.
factorio-ai-assistant-advisor-oil-imbalance-minutes=How long oil surplus and petroleum deficit must persist together.
factorio-ai-assistant-advisor-oil-surplus-min-per-minute=Minimum 10-minute heavy/light oil net surplus.
factorio-ai-assistant-advisor-petroleum-deficit-min-per-minute=Minimum 10-minute petroleum gas net deficit.
factorio-ai-assistant-advisor-science-stable-minutes=How long stable chemical science must persist before suggesting construction robotics.
factorio-ai-assistant-advisor-blue-science-min-per-minute=Minimum production in both 1-minute and 10-minute windows.
factorio-ai-assistant-advisor-material-deficit-ratio=Consumption must exceed production by this multiplier.
factorio-ai-assistant-advisor-material-deficit-min-per-minute=Ignore key materials consumed below this 10-minute rate.
factorio-ai-assistant-advisor-material-deficit-minutes=How long a key material deficit must persist.
factorio-ai-assistant-advisor-crude-decline-ratio=Alert when 1-minute crude output falls below this fraction of its 10-minute rate.
factorio-ai-assistant-advisor-crude-baseline-min-per-minute=Ignore crude oil below this 10-minute baseline.
factorio-ai-assistant-advisor-crude-decline-minutes=How long crude oil decline must persist.
factorio-ai-assistant-advisor-key-material-baseline-min-per-minute=Only call a key line stopped if its 10-minute production reached this rate.
factorio-ai-assistant-advisor-production-stop-minutes=How long a key line may remain at zero 1-minute production.
